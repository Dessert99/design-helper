<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- dh:revision -->
<title>시안 비교</title>
<!-- Project stylesheets (tokens.css, $WS/sheet.css) go here, before the sheet style. -->
<!-- dh:head -->
<style>
:root {
  --dh-page:#f1f1f3; --dh-surface:#ffffff; --dh-line:#e7e7ea; --dh-ink:#1f1f23; --dh-sub:#63636b;
  --dh-muted:#8b8b93; --dh-accent:#3b5bdb; --dh-accent-tint:rgba(59,91,219,.10); --dh-radius:14px;
  --dh-float:0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.06);
}
*, *::before, *::after { box-sizing:border-box }
body { margin:0; background:var(--dh-page); color:var(--dh-ink);
       font:13px/1.6 -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif }
.dh-main { padding:8px 44px 64px }

.dh-has-toc { display:flex; align-items:flex-start }
.dh-has-toc > .dh-main { flex:1; min-width:0 }
.dh-toc { flex:none; width:220px; position:sticky; top:0; height:100vh; overflow-y:auto;
       padding:28px 16px; background:var(--dh-surface); border-right:1px solid var(--dh-line);
       font-size:12px }
.dh-toc-h { font-size:11px; font-weight:700; color:var(--dh-muted); letter-spacing:.04em; margin:0 0 14px }
.dh-toc-turn { font-weight:700; font-size:12.5px; margin:16px 0 4px }
.dh-toc a { display:block; color:var(--dh-sub); text-decoration:none; padding:4px 8px;
         margin-left:-8px; border-radius:6px }
.dh-toc a.dh-cur { background:var(--dh-accent-tint); color:var(--dh-accent); font-weight:600 }
/* Checklist progress (design-system only): reading position, never a control. */
.dh-progress { margin:0 0 22px; padding:0 0 16px; border-bottom:1px solid var(--dh-line); color:var(--dh-sub) }
.dh-progress-h { font-size:11px; font-weight:700; color:var(--dh-muted); letter-spacing:.04em; margin:0 0 8px }
.dh-progress-row { display:flex; justify-content:space-between; gap:8px; padding:2px 0 }
.dh-progress-row b { font-weight:600; color:var(--dh-ink) }

.dh-turn { display:flex; align-items:center; gap:16px; margin:72px 0 0;
        font-size:14px; font-weight:700; color:var(--dh-ink) }
.dh-turn::after { content:""; flex:1; height:2px; background:#d4d4d9; border-radius:1px }
.dh-main > .dh-turn:first-child { margin-top:32px }

.dh-main > section > h2 { font-size:20px; letter-spacing:-.01em; margin:22px 0 18px }
.dh-desc { color:var(--dh-sub); margin:0 0 16px; max-width:820px }

.dh-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:36px 28px }
/* The frame stretches; the specimen inside stays at its true size, centered. */
.dh-frame { display:flex; justify-content:center; background:var(--dh-surface); border:1px solid rgba(0,0,0,.04);
         border-radius:var(--dh-radius); box-shadow:var(--dh-float); padding:18px 14px; overflow:hidden }
.dh-frame > * { flex-shrink:0 }
.dh-cap { margin-top:12px; font-size:14px; line-height:1.7 }
.dh-cap .dh-n { display:flex; align-items:center; gap:8px; font-weight:700 }
.dh-badge { display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 6px;
         border-radius:6px; background:var(--dh-accent); color:#fff; font-size:12px; font-weight:700 }
.dh-cost { margin-left:auto; font-size:11.5px; font-weight:500; padding:1px 8px;
        border-radius:99px; background:var(--dh-page); color:#52525b }
.dh-cap p { margin:6px 0 0 } .dh-cap .dh-resolved { margin-top:2px; font-size:13px; color:var(--dh-muted) }
.dh-gain { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:10px 0 0; color:var(--dh-sub) }
.dh-gain dt { color:var(--dh-ink); font-weight:600 } .dh-gain dd { margin:0 }
.dh-bound { display:flex; gap:12px; max-width:820px; margin:18px 0 0; font-size:14px; line-height:1.7; color:var(--dh-sub) }
.dh-bound > b { color:var(--dh-ink); white-space:nowrap }
/* Korean breaks between words, not inside them. */
.dh-cap, .dh-bound, .dh-pick, .dh-main > section > h2, .dh-toc { word-break:keep-all; overflow-wrap:anywhere }
.dh-pick { display:flex; gap:12px; max-width:820px; margin:14px 0 0; padding:12px 16px; font-size:14px; line-height:1.7;
        background:var(--dh-surface); border:1px solid rgba(0,0,0,.04);
        border-radius:var(--dh-radius); box-shadow:var(--dh-float) }
.dh-pick > b { color:var(--dh-accent); white-space:nowrap }
/* 실물과 다름: a specimen that differs from what the code will do. */
.dh-real { font-size:11.5px; font-weight:500; padding:0 7px; border-radius:99px;
        border:1px dashed #a1a1aa; color:#52525b }
.dh-n > .dh-real { margin-left:auto } .dh-real + .dh-cost { margin-left:8px }
/* A gray bracket beside the spot where the rungs differ, outside the specimen's pixels. */
.dh-at { position:relative }
.dh-look { position:absolute; pointer-events:none; border:0 solid var(--dh-muted); border-radius:1px }
.dh-look.dh-x { bottom:-9px; height:0; border-bottom-width:2px }   /* set left and width */
.dh-look.dh-y { left:-9px; width:0; border-left-width:2px }        /* set top and height */
</style>
<style>
/* Specimen CSS goes here, after the sheet style. Scope it to its section id. */
/* dh:style */
</style>
</head>
<body class="dh-has-toc">
<nav class="dh-toc">
  <!-- Checklist progress goes here (design-system): <div class="dh-progress">...</div> -->
  <!-- dh:progress -->
  <div class="dh-toc-h">목차</div>
  <!-- Turn labels and section links go here: <div class="dh-toc-turn">요청 1 · ...</div> <a href="#r1-1">...</a> -->
  <!-- dh:toc -->
</nav>
<main class="dh-main">
  <!-- Turn dividers and sections go here, appended in order, as direct children of main. -->
  <!-- dh:main -->
</main>

<!-- Section controls (references/controls.md) go here, before the scripts below. -->
<!-- dh:script -->

<script>
(() => {
  const links = [...document.querySelectorAll('.dh-toc a')];
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    links.forEach(a => a.classList.toggle('dh-cur', a.hash === '#' + e.target.id));
  }), { rootMargin: '0px 0px -70% 0px' });
  document.querySelectorAll('.dh-main > section[id]').forEach(s => io.observe(s));
})();
</script>
<script>
(() => {
  history.scrollRestoration = 'manual';   // place() decides where the reload lands
  const S = sessionStorage;
  const n = document.querySelectorAll('.dh-main > section').length;
  const prev = +S.getItem('n') || 0, y = +S.getItem('y') || 0;
  S.setItem('n', n);

  let touched = false;
  const place = () => {
    if (touched) return;
    if (n > prev) document.querySelectorAll('.dh-main > section')[n - 1]?.scrollIntoView();
    else scrollTo(0, y);
  };
  addEventListener('load', place);
  document.fonts?.ready.then(place);
  addEventListener('scroll', () => { touched = true; S.setItem('y', scrollY); }, { passive: true });

  // Compare against the revision this page was served with, not the first poll: an edit
  // that lands while the page is reloading is still caught.
  const revision = document.querySelector('meta[name="dh-revision"]')?.content;
  if (!revision || !/^https?:$/.test(location.protocol)) return;
  let polling = false;
  setInterval(async () => {
    if (polling) return;
    polling = true;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    try {
      const r = await fetch(location.href, {
        method: 'HEAD', cache: 'no-store', signal: controller.signal,
      });
      const etag = r.headers.get('etag');
      if (r.ok && etag && etag !== '"' + revision + '"') location.reload();
    } catch {
      // Server unreachable: keep the current page and retry on the next tick.
    } finally {
      clearTimeout(timeout);
      polling = false;
    }
  }, 1000);
})();
</script>
</body>
</html>
